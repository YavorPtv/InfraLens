name: Smoke tests (existing deployment required)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Validate existing API deployment over HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Optional short-lived Cognito access token; never required for unauthenticated checks.
      INFRALENS_SMOKE_ACCESS_TOKEN: ${{ secrets.INFRALENS_SMOKE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Load public test deployment outputs
        env:
          INFRALENS_TEST_DEPLOYMENT_OUTPUTS: ${{ vars.INFRALENS_TEST_DEPLOYMENT_OUTPUTS }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const input = process.env.INFRALENS_TEST_DEPLOYMENT_OUTPUTS;
          if (!input) throw new Error('Set INFRALENS_TEST_DEPLOYMENT_OUTPUTS to the public test CDK outputs JSON.');
          const document = JSON.parse(input);
          fs.writeFileSync('infra/cdk/cdk-outputs.test.json', JSON.stringify(document));
          NODE
      - name: Smoke test existing deployment (no infrastructure deployment)
        run: npm run test:smoke -- --target test
